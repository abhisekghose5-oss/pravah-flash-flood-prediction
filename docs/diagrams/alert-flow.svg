<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0a0f1d; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="g-trigger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="g-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="30" y="20" width="940" height="60" rx="10" fill="#131d33" stroke="#1e293b"/>
  <text x="50" y="55" fill="#38bdf8" font-size="20" font-weight="700">PRAVAH — MULTI-CHANNEL EMERGENCY ALERT DISPATCH FLOW</text>
  <text x="680" y="55" fill="#94a3b8" font-size="12">Central Hub · Async Gather · Failure Isolated</text>

  <!-- Triggers Column -->
  <g transform="translate(40, 105)">
    <rect width="220" height="420" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="220" height="35" rx="10" fill="#0284c7"/>
    <text x="110" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">TRIGGER SOURCES</text>

    <g transform="translate(15, 50)">
      <rect width="190" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="600">River Gauge Breach</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9">CWC Stage &gt; Warning / Danger</text>
      <text x="12" y="52" fill="#38bdf8" font-size="8">TriggerType.RIVER_LEVEL</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="190" height="70" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="600">ML Flood Prediction</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9">Onset Probability &gt; Tuned CSI</text>
      <text x="12" y="52" fill="#10b981" font-size="8">AlertSeverity.WARNING / CRITICAL</text>
    </g>

    <g transform="translate(15, 220)">
      <rect width="190" height="70" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="600">Simulation Inundation</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9">Dam Release / High Wave</text>
      <text x="12" y="52" fill="#f59e0b" font-size="8">AlertSeverity.EVACUATION</text>
    </g>

    <g transform="translate(15, 305)">
      <rect width="190" height="70" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="600">SOS Community Verification</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9">Rapid local waterlogging report</text>
      <text x="12" y="52" fill="#a855f7" font-size="8">TriggerType.COMMUNITY_SOS</text>
    </g>
  </g>

  <!-- Connect Triggers to Central Dispatcher -->
  <line x1="260" y1="315" x2="330" y2="315" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Central Dispatcher Box -->
  <g transform="translate(330, 105)">
    <rect width="280" height="420" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <rect width="280" height="35" rx="10" fill="#2563eb"/>
    <text x="140" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">CENTRAL DISPATCH HUB (AlertManager)</text>

    <g transform="translate(15, 50)">
      <rect width="250" height="75" rx="6" fill="#1e293b"/>
      <text x="12" y="20" fill="#93c5fd" font-size="11" font-weight="600">1. Payload Normalization</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9">Validates AlertTriggerRequest</text>
      <text x="12" y="50" fill="#94a3b8" font-size="9">Generates alert_id (UUID4)</text>
      <text x="12" y="64" fill="#38bdf8" font-size="8">Stores initial audit row in SQLite</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="250" height="85" rx="6" fill="#1e293b"/>
      <text x="12" y="20" fill="#93c5fd" font-size="11" font-weight="600">2. Template Formatting Engine</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">render_alert_message(req, channel)</text>
      <text x="12" y="50" fill="#94a3b8" font-size="8">• SMS: Compact 160-char GSM plain text</text>
      <text x="12" y="64" fill="#94a3b8" font-size="8">• WhatsApp: Rich markdown with buttons</text>
      <text x="12" y="78" fill="#94a3b8" font-size="8">• IVRS: Spoken voice script synthesized</text>
    </g>

    <g transform="translate(15, 240)">
      <rect width="250" height="85" rx="6" fill="#1e293b"/>
      <text x="12" y="20" fill="#93c5fd" font-size="11" font-weight="600">3. Concurrent Async Dispatch</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">asyncio.gather(*tasks, return_exceptions=True)</text>
      <text x="12" y="52" fill="#34d399" font-size="9">✓ Zero Blocking between channels</text>
      <text x="12" y="68" fill="#34d399" font-size="9">✓ Isolated Provider Failure</text>
    </g>

    <g transform="translate(15, 340)">
      <rect width="250" height="65" rx="6" fill="#1e293b"/>
      <text x="12" y="20" fill="#93c5fd" font-size="11" font-weight="600">4. Receipt &amp; Status Aggregation</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9">Record delivery statuses in database</text>
      <text x="12" y="50" fill="#38bdf8" font-size="8">DELIVERED · SIMULATED · FAILED</text>
    </g>
  </g>

  <!-- Outbound Connectors to 4 Channels -->
  <line x1="610" y1="180" x2="680" y2="155" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="610" y1="260" x2="680" y2="250" stroke="#22c55e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="340" x2="680" y2="345" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="420" x2="680" y2="440" stroke="#eab308" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Channel Targets Column -->
  <g transform="translate(680, 105)">
    <rect width="280" height="420" rx="10" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
    <rect width="280" height="35" rx="10" fill="#334155"/>
    <text x="140" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ACTIVE CHANNELS (ISOLATED)</text>

    <!-- SMS -->
    <g transform="translate(15, 45)">
      <rect width="250" height="75" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="12" y="20" fill="#fda4af" font-size="11" font-weight="600">SMSAlertChannel</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Twilio REST Client / Mock SIM_SMS</text>
      <text x="12" y="50" fill="#94a3b8" font-size="8">Fallback: Cellular offline delivery</text>
      <text x="12" y="64" fill="#fda4af" font-size="8">Status: SENT / SIMULATED</text>
    </g>

    <!-- WhatsApp -->
    <g transform="translate(15, 135)">
      <rect width="250" height="75" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
      <text x="12" y="20" fill="#86efac" font-size="11" font-weight="600">WhatsAppAlertChannel</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Twilio WhatsApp Sandbox / Business API</text>
      <text x="12" y="50" fill="#94a3b8" font-size="8">Includes Shelter GPS link &amp; route preview</text>
      <text x="12" y="64" fill="#86efac" font-size="8">Status: SENT / SIMULATED</text>
    </g>

    <!-- Telegram -->
    <g transform="translate(15, 225)">
      <rect width="250" height="75" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="12" y="20" fill="#7dd3fc" font-size="11" font-weight="600">TelegramAlertChannel</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Telegram Bot API (sendMessage)</text>
      <text x="12" y="50" fill="#94a3b8" font-size="8">Community disaster channels + direct chats</text>
      <text x="12" y="64" fill="#7dd3fc" font-size="8">Status: DELIVERED / SIMULATED</text>
    </g>

    <!-- IVRS Voice -->
    <g transform="translate(15, 315)">
      <rect width="250" height="85" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
      <text x="12" y="20" fill="#fef08a" font-size="11" font-weight="600">IVRSAlertChannel (NEW)</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Twilio Voice API / TwiML Text-to-Speech</text>
      <text x="12" y="50" fill="#94a3b8" font-size="8">Urgent audio call with synthesized voice</text>
      <text x="12" y="64" fill="#fef08a" font-size="8">Auto-recorded in ivrs_call_records table</text>
      <text x="12" y="78" fill="#eab308" font-size="8">Status: COMPLETED / SIMULATED</text>
    </g>
  </g>

  <!-- Bottom: SQLite Audit Verification -->
  <g transform="translate(40, 545)">
    <rect width="920" height="110" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="26" fill="#38bdf8" font-size="12" font-weight="700">PERSISTENCE AUDIT &amp; SUBSCRIBER MANAGEMENT</text>
    <text x="25" y="46" fill="#94a3b8" font-size="10">Subscriptions Registry (subscriptions) ➔ Active Channels List ➔ Alert Deliveries (alert_channel_deliveries)</text>
    <text x="25" y="62" fill="#94a3b8" font-size="10">Voice Call Records (ivrs_call_records): call_id, recipient_phone, duration_seconds, call_status, script_text</text>
    <text x="25" y="78" fill="#34d399" font-size="10">Guaranteed idempotency: Individual channel errors are caught, logged, and will never crash remaining channels.</text>
  </g>
</svg>
