<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0a0f1d; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="30" y="20" width="940" height="60" rx="10" fill="#131d33" stroke="#1e293b"/>
  <text x="50" y="55" fill="#38bdf8" font-size="20" font-weight="700">PRAVAH — SAFE EVACUATION ROUTE PLANNING ENGINE</text>
  <text x="660" y="55" fill="#94a3b8" font-size="12">Hazard-Aware Routing · Multi-Factor Graph · Safe Shelters</text>

  <!-- Step 1: Input & Context -->
  <g transform="translate(40, 105)">
    <rect width="200" height="420" rx="10" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="200" height="35" rx="10" fill="#0284c7"/>
    <text x="100" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. INPUT COORDINATES</text>

    <g transform="translate(15, 50)">
      <rect width="170" height="85" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="600">Origin Coordinates</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">Lat / Lng of evacuee</text>
      <text x="12" y="56" fill="#94a3b8" font-size="9">e.g. Karad (17.289, 74.181)</text>
      <text x="12" y="72" fill="#34d399" font-size="8">Auto-snaps to nearest road</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="170" height="85" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="600">Routing Goal</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">• LOWEST_RISK (default)</text>
      <text x="12" y="56" fill="#cbd5e1" font-size="9">• SHORTEST_DISTANCE</text>
      <text x="12" y="72" fill="#cbd5e1" font-size="9">• FASTEST_TIME</text>
    </g>

    <g transform="translate(15, 250)">
      <rect width="170" height="85" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="600">Shelter Registry</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">10 Relief Shelters</text>
      <text x="12" y="56" fill="#94a3b8" font-size="9">Capacities, generator,</text>
      <text x="12" y="72" fill="#38bdf8" font-size="8">water &amp; medical supplies</text>
    </g>

    <g transform="translate(15, 350)">
      <rect width="170" height="55" rx="6" fill="#1e293b"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="600">Max Radius</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9">Default: 15.0 km radius</text>
    </g>
  </g>

  <!-- Connect 1 -> 2 -->
  <line x1="240" y1="315" x2="280" y2="315" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: Dynamic Hazard Cost Overlay -->
  <g transform="translate(280, 105)">
    <rect width="210" height="420" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="210" height="35" rx="10" fill="#d97706"/>
    <text x="105" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. HAZARD MAP INTERSECT</text>

    <g transform="translate(15, 50)">
      <rect width="180" height="95" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#fbbf24" font-size="11" font-weight="600">Road Network Graph</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">Vertices: Intersections</text>
      <text x="12" y="56" fill="#cbd5e1" font-size="9">Edges: Highways, Arterials</text>
      <text x="12" y="72" fill="#94a3b8" font-size="8">Attributes: length_m, speed_kmh,</text>
      <text x="12" y="86" fill="#94a3b8" font-size="8">elevation_m, road_type</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="180" height="115" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <text x="12" y="22" fill="#f87171" font-size="11" font-weight="600">Submersion Exclusion</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">If Edge Depth &gt; 0.3m:</text>
      <text x="12" y="56" fill="#fca5a5" font-size="9">➔ MARK SUBMERGED</text>
      <text x="12" y="72" fill="#fca5a5" font-size="9">➔ Cost = INFINITY</text>
      <text x="12" y="90" fill="#cbd5e1" font-size="8">Vehicular traversal blocked;</text>
      <text x="12" y="104" fill="#cbd5e1" font-size="8">culverts &amp; bridges culled</text>
    </g>

    <g transform="translate(15, 290)">
      <rect width="180" height="115" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#fbbf24" font-size="11" font-weight="600">Risk Weight Formula</text>
      <text x="12" y="40" fill="#94a3b8" font-size="9">Weight = Distance ×</text>
      <text x="12" y="56" fill="#cbd5e1" font-size="8">[ 1 + 5·FloodProb + 2·Depth</text>
      <text x="12" y="72" fill="#cbd5e1" font-size="8">  - 0.5·(Elev - MeanElev) ]</text>
      <text x="12" y="90" fill="#34d399" font-size="8">Favors ridgelines &amp; crests</text>
      <text x="12" y="104" fill="#34d399" font-size="8">Penalizes low riparian beds</text>
    </g>
  </g>

  <!-- Connect 2 -> 3 -->
  <line x1="490" y1="315" x2="530" y2="315" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: Routing Solver -->
  <g transform="translate(530, 105)">
    <rect width="210" height="420" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="35" rx="10" fill="#059669"/>
    <text x="105" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. GRAPH SOLVER</text>

    <g transform="translate(15, 50)">
      <rect width="180" height="110" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#34d399" font-size="11" font-weight="600">Dijkstra Algorithm</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">Priority Queue Min-Heap</text>
      <text x="12" y="56" fill="#94a3b8" font-size="8">Explores lowest accumulated risk</text>
      <text x="12" y="72" fill="#94a3b8" font-size="8">Guaranteed optimal path</text>
      <text x="12" y="90" fill="#34d399" font-size="8">Used for: LOWEST_RISK</text>
    </g>

    <g transform="translate(15, 175)">
      <rect width="180" height="110" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#34d399" font-size="11" font-weight="600">A* Search Algorithm</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">Heuristic h(n) = Haversine</text>
      <text x="12" y="56" fill="#94a3b8" font-size="8">Direct Euclidean distance</text>
      <text x="12" y="72" fill="#94a3b8" font-size="8">Accelerated goal convergence</text>
      <text x="12" y="90" fill="#34d399" font-size="8">Used for: FASTEST / SHORTEST</text>
    </g>

    <g transform="translate(15, 300)">
      <rect width="180" height="105" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#34d399" font-size="11" font-weight="600">Alternative Pathfinding</text>
      <text x="12" y="40" fill="#cbd5e1" font-size="9">K-Shortest Paths (Yen's)</text>
      <text x="12" y="56" fill="#94a3b8" font-size="8">Penalizes primary corridor</text>
      <text x="12" y="74" fill="#38bdf8" font-size="8">Yields secondary evacuation</text>
      <text x="12" y="90" fill="#38bdf8" font-size="8">fallback corridor</text>
    </g>
  </g>

  <!-- Connect 3 -> 4 -->
  <line x1="740" y1="315" x2="780" y2="315" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 4: Evacuation Plan Output -->
  <g transform="translate(780, 105)">
    <rect width="180" height="420" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="180" height="35" rx="10" fill="#0284c7"/>
    <text x="90" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. EVACUATION PLAN</text>

    <g transform="translate(10, 50)">
      <rect width="160" height="90" rx="6" fill="#1e293b"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="600">Safe Shelter Target</text>
      <text x="10" y="40" fill="#cbd5e1" font-size="9">Karad Elevated Center</text>
      <text x="10" y="56" fill="#94a3b8" font-size="8">Capacity: 450 beds</text>
      <text x="10" y="70" fill="#94a3b8" font-size="8">Elevation: 585m MSL</text>
      <text x="10" y="84" fill="#34d399" font-size="8">Zero Inundation Risk</text>
    </g>

    <g transform="translate(10, 150)">
      <rect width="160" height="110" rx="6" fill="#1e293b"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="600">Route Metrics</text>
      <text x="10" y="40" fill="#cbd5e1" font-size="9">• Distance: 4.8 km</text>
      <text x="10" y="56" fill="#cbd5e1" font-size="9">• Travel Time: 18 mins</text>
      <text x="10" y="72" fill="#cbd5e1" font-size="9">• Flood Risk: 4.2%</text>
      <text x="10" y="88" fill="#cbd5e1" font-size="9">• Roads Blocked: 0</text>
      <text x="10" y="102" fill="#34d399" font-size="8">Clear passage confirmed</text>
    </g>

    <g transform="translate(10, 270)">
      <rect width="160" height="135" rx="6" fill="#1e293b"/>
      <text x="10" y="20" fill="#38bdf8" font-size="11" font-weight="600">Turn-by-Turn GPS</text>
      <text x="10" y="38" fill="#94a3b8" font-size="8">1. Start at Karad West</text>
      <text x="10" y="54" fill="#94a3b8" font-size="8">2. East on Station Rd (1.2km)</text>
      <text x="10" y="70" fill="#94a3b8" font-size="8">3. Turn Left SH-72 Ridge</text>
      <text x="10" y="86" fill="#94a3b8" font-size="8">4. Continue 2.5km to Ridge</text>
      <text x="10" y="102" fill="#94a3b8" font-size="8">5. Arrive at Relief Center</text>
      <text x="10" y="122" fill="#38bdf8" font-size="8">GeoJSON coordinates payload</text>
    </g>
  </g>

  <!-- Bottom: Summary Banner -->
  <g transform="translate(40, 545)">
    <rect width="920" height="110" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="26" fill="#38bdf8" font-size="12" font-weight="700">EVACUATION ENGINE PERSISTENCE &amp; CENTRAL ALERT COUPLING</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="10">Saved to SQLite table: evacuation_routes (route_id, origin_lat, origin_lng, shelter_id, distance_km, travel_time_mins)</text>
    <text x="25" y="66" fill="#94a3b8" font-size="10">Coupled directly into AlertManager: Route summary and designated shelter are injected into SMS, WhatsApp, Telegram, and IVRS</text>
    <text x="25" y="84" fill="#34d399" font-size="10">Residents receive actionable destination names and turn-by-turn guidance rather than vague alarm signals.</text>
  </g>
</svg>
